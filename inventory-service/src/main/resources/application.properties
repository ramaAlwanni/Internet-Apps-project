spring.application.name=inventory-service

server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${INVENTORY_DB_USERNAME:inventory}
spring.datasource.password=${INVENTORY_DB_PASSWORD:inventory_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Stale RESERVED reservations are released by a scheduled safety net.
# 10 minutes >> the 5s gRPC deadline, so a healthy in-flight order is never
# mistaken for an abandoned reservation.
inventory.reservations.stale-after-minutes=${INVENTORY_STALE_RESERVATION_MINUTES:10}
inventory.reservations.cleanup-initial-delay-ms=${INVENTORY_STALE_CLEANUP_INITIAL_DELAY_MS:10000}
inventory.reservations.cleanup-interval-ms=${INVENTORY_STALE_CLEANUP_INTERVAL_MS:60000}
inventory.reservations.cleanup-batch-size=${INVENTORY_STALE_CLEANUP_BATCH_SIZE:200}

grpc.server.port=9090