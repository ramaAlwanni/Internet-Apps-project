spring.application.name=inventory-service

server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${INVENTORY_DB_USERNAME:inventory}
spring.datasource.password=${INVENTORY_DB_PASSWORD:inventory_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

grpc.server.port=9090