; OPcache tuning for development on Windows bind mounts (9p/drvfs).
;
; The project directory is bind-mounted from the Windows host through the slow
; 9p filesystem. With `opcache.validate_timestamps=1` PHP periodically stat()s
; every cached file to detect changes; on 9p that turns into multi-second
; request stalls (we measured ~25% of requests jumping to ~1.8s).
;
; Disabling timestamp validation removes those stalls. The trade-off:
; edited PHP files are NOT picked up until PHP-FPM restarts, so after changing
; code run:  docker compose restart backend
;
; If you prefer automatic pickup and can accept occasional stalls, set
; `opcache.validate_timestamps=1` and a larger `opcache.revalidate_freq`.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
