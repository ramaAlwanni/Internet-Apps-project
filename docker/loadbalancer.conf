# Docker's embedded DNS rewrites this record when replicas are added/removed.
# `resolve` requires the shared `zone`; valid=5s bounds stale peer addresses.
resolver 127.0.0.11 ipv6=off valid=5s;

upstream store_backends {
    zone store_backends 64k;

    # Requests are not CPU-equal (product listing/cache misses hit MySQL).
    # least_conn avoids piling new requests onto a replica that is already busy;
    # no sticky sessions are needed because JWTs, DB sessions and Redis cache
    # are shared by every replica.
    least_conn;

    # Docker DNS returns one A record per running backend replica.
    server backend:80 resolve max_fails=2 fail_timeout=5s;

    # Keep idle upstream connections open to reduce handshake overhead.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://store_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passive health checks: a replica that fails/times out is ejected for
        # fail_timeout seconds; the next request goes to a healthy replica.
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
