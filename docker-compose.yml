
services:
  mysql-primary:
    image: internet-apps-mysql:local
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-internet_apps}"
      MYSQL_USER: "${DB_USERNAME:-internet_apps}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-local_root_password}"
      MYSQL_REPLICATION_ROLE: primary
      MYSQL_REPLICATION_USER: "${DB_REPLICATION_USER:-replicator}"
      MYSQL_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:-local_replication_password}"
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  mysql-replica:
    image: internet-apps-mysql:local
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-local_root_password}"
      MYSQL_REPLICATION_ROLE: replica
      MYSQL_REPLICATION_USER: "${DB_REPLICATION_USER:-replicator}"
      MYSQL_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:-local_replication_password}"
      MYSQL_REPLICATED_DATABASE: "${DB_DATABASE:-internet_apps}"
      MYSQL_REPLICATED_USER: "${DB_USERNAME:-internet_apps}"
    volumes:
      - mysql_replica_data:/var/lib/mysql
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent &&
          mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" "$${MYSQL_REPLICATED_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1 &&
          mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT 1 FROM mysql.user WHERE user = '$${MYSQL_REPLICATED_USER}' LIMIT 1" | grep -q '^1$' &&
          status="$$(mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e 'SHOW REPLICA STATUS\G' 2>/dev/null)" &&
          echo "$$status" | grep -q 'Replica_IO_Running: Yes' &&
          echo "$$status" | grep -q 'Replica_SQL_Running: Yes'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app-network

  inventory-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${INVENTORY_DB_DATABASE:-inventory_db}"
      MYSQL_USER: "${INVENTORY_DB_USERNAME:-inventory}"
      MYSQL_PASSWORD: "${INVENTORY_DB_PASSWORD:-inventory_dev_password}"
      MYSQL_ROOT_PASSWORD: "${INVENTORY_DB_ROOT_PASSWORD:-local_inventory_root_password}"
    volumes:
      - inventory_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  migrate:
    image: internet-apps-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      DB_CONNECTION: mysql
      DB_HOST: mysql-primary
      DB_WRITE_HOST: mysql-primary
      DB_READ_HOST: mysql-primary
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  inventory-service:
    image: internet-apps-inventory:local
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://inventory-db:3306/${INVENTORY_DB_DATABASE:-inventory_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      INVENTORY_DB_USERNAME: "${INVENTORY_DB_USERNAME:-inventory}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:-inventory_dev_password}"
    ports:
      - "${GRPC_FORWARD_PORT:-9090}:9090"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - app-network

  backend:
    image: internet-apps-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      DB_CONNECTION: mysql
      DB_HOST: mysql-primary
      DB_WRITE_HOST: "${DB_WRITE_HOST:-mysql-primary}"
      DB_READ_HOST: "${DB_READ_HOST:-mysql-replica}"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ORDER_STOCK_MANAGER: grpc
      GRPC_INVENTORY_HOST: inventory-service:9090
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
      - ./docker/nginx.conf:/etc/nginx/sites-available/default:ro
      - product_images:/var/www/html/storage/app/public/products
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql-replica:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  k6:
    image: grafana/k6:latest
    container_name: k6-load-test
    profiles:
      - load-test
    volumes:
      - ./tests/k6:/tests
    command: ["run", "/tests/read-write-verification.js"]
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  mysql_primary_data:
  mysql_replica_data:
  inventory_mysql_data:
  product_images:

networks:
  app-network:
    driver: bridge
