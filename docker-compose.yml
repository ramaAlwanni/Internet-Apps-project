services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-internet_apps}"
      MYSQL_USER: "${DB_USERNAME:-internet_apps}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-local_root_password}"
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  inventory-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${INVENTORY_DB_DATABASE:-inventory_db}"
      MYSQL_USER: "${INVENTORY_DB_USERNAME:-inventory}"
      MYSQL_PASSWORD: "${INVENTORY_DB_PASSWORD:-inventory_dev_password}"
      MYSQL_ROOT_PASSWORD: "${INVENTORY_DB_ROOT_PASSWORD:-local_inventory_root_password}"
    volumes:
      - inventory_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  migrate:
    image: internet-apps-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  inventory-service:
    image: internet-apps-inventory:local
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://inventory-db:3306/${INVENTORY_DB_DATABASE:-inventory_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      INVENTORY_DB_USERNAME: "${INVENTORY_DB_USERNAME:-inventory}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:-inventory_dev_password}"
    ports:
      - "${GRPC_FORWARD_PORT:-9090}:9090"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - app-network

  backend:
    image: internet-apps-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      ORDER_STOCK_MANAGER: grpc
      GRPC_INVENTORY_HOST: inventory-service:9090
    volumes:
      - ./.env:/var/www/html/.env
      - product_images:/var/www/html/storage/app/public/products
    depends_on:
      migrate:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:
  inventory_mysql_data:
  product_images:

networks:
  app-network:
    driver: bridge
