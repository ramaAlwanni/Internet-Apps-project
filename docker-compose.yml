services:
  mysql-primary:
    image: internet-apps-mysql:local
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-internet_apps}"
      MYSQL_USER: "${DB_USERNAME:-internet_apps}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-local_root_password}"
      MYSQL_REPLICATION_ROLE: primary
      MYSQL_REPLICATION_USER: "${DB_REPLICATION_USER:-replicator}"
      MYSQL_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:-local_replication_password}"
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  mysql-replica:
    image: internet-apps-mysql:local
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-local_root_password}"
      MYSQL_REPLICATION_ROLE: replica
      MYSQL_REPLICATION_USER: "${DB_REPLICATION_USER:-replicator}"
      MYSQL_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:-local_replication_password}"
      MYSQL_REPLICATED_DATABASE: "${DB_DATABASE:-internet_apps}"
      MYSQL_REPLICATED_USER: "${DB_USERNAME:-internet_apps}"
    volumes:
      - mysql_replica_data:/var/lib/mysql
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent &&
          mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" "$${MYSQL_REPLICATED_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1 &&
          mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT 1 FROM mysql.user WHERE user = '$${MYSQL_REPLICATED_USER}' LIMIT 1" | grep -q '^1$' &&
          status="$$(mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e 'SHOW REPLICA STATUS\G' 2>/dev/null)" &&
          echo "$$status" | grep -q 'Replica_IO_Running: Yes' &&
          echo "$$status" | grep -q 'Replica_SQL_Running: Yes'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app-network

  inventory-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${INVENTORY_DB_DATABASE:-inventory_db}"
      MYSQL_USER: "${INVENTORY_DB_USERNAME:-inventory}"
      MYSQL_PASSWORD: "${INVENTORY_DB_PASSWORD:-inventory_dev_password}"
      MYSQL_ROOT_PASSWORD: "${INVENTORY_DB_ROOT_PASSWORD:-local_inventory_root_password}"
    volumes:
      - inventory_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  migrate:
    image: internet-apps-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      DB_CONNECTION: mysql
      DB_HOST: mysql-primary
      DB_WRITE_HOST: mysql-primary
      DB_READ_HOST: mysql-primary
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  inventory-service:
    image: internet-apps-inventory:local
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://inventory-db:3306/${INVENTORY_DB_DATABASE:-inventory_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      INVENTORY_DB_USERNAME: "${INVENTORY_DB_USERNAME:-inventory}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:-inventory_dev_password}"
      # Safety net for reservations abandoned by a crashed caller.
      INVENTORY_STALE_RESERVATION_MINUTES: "${INVENTORY_STALE_RESERVATION_MINUTES:-10}"
      INVENTORY_STALE_CLEANUP_INITIAL_DELAY_MS: "${INVENTORY_STALE_CLEANUP_INITIAL_DELAY_MS:-10000}"
      INVENTORY_STALE_CLEANUP_INTERVAL_MS: "${INVENTORY_STALE_CLEANUP_INTERVAL_MS:-60000}"
      INVENTORY_STALE_CLEANUP_BATCH_SIZE: "${INVENTORY_STALE_CLEANUP_BATCH_SIZE:-200}"
    ports:
      - "${GRPC_FORWARD_PORT:-9090}:9090"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - app-network

  backend:
    image: internet-apps-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    # Three independent PHP-FPM/Nginx containers. Docker DNS publishes one A
    # record per replica, which Nginx re-resolves every 5 seconds.
    deploy:
      replicas: 3
    # No host ports: the only entry point is the load balancer.
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      # Fail fast instead of silently giving replicas different encryption keys.
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"
      SESSION_DRIVER: database
      DB_CONNECTION: mysql
      DB_HOST: mysql-primary
      DB_WRITE_HOST: "${DB_WRITE_HOST:-mysql-primary}"
      DB_READ_HOST: "${DB_READ_HOST:-mysql-replica}"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      # Shared cache/rate-limit/counter state; never `file` across replicas.
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ORDER_STOCK_MANAGER: grpc
      GRPC_INVENTORY_HOST: inventory-service:9090
      GRPC_INVENTORY_TIMEOUT: "${GRPC_INVENTORY_TIMEOUT:-5}"
    volumes:
      # Code is baked into the image. Do not bind-mount the whole source tree:
      # that would make compiled views/logs/bootstrap cache shared mutable host
      # state and would let a stale host cache override Compose env vars.
      - ./.env:/var/www/html/.env:ro
      # Deliberately shared by all replicas (image uploads must be visible to
      # whichever replica serves the next request). Use S3 in production.
      - product_images:/var/www/html/storage/app/public/products
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql-replica:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  loadbalancer:
    image: nginx:1.28-alpine
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./docker/loadbalancer.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  reverb:
    image: internet-apps-backend:local
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    ports:
      - "${REVERB_PORT:-6001}:6001"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-100100}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-local-reverb-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-local-reverb-secret}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "6001"
      REVERB_SCHEME: "http"
      # Reverb pub/sub state lives in Redis, not in the container filesystem.
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./.env:/var/www/html/.env:ro
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - loadbalancer
    networks:
      - app-network

  k6:
    image: grafana/k6:latest
    profiles:
      - load-test
    volumes:
      - ./tests/k6:/tests
    command: ["run", "/tests/load-balancer-test.js"]
    networks:
      - app-network
    depends_on:
      - loadbalancer

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: internet-apps-rabbitmq
    ports:
      - "${RABBITMQ_FORWARD_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # `ping` only proves the Erlang node is up; it can go healthy before the
    # AMQP listener on 5672 accepts connections and rabbitmq:setup dies with
    # "Connection refused". Check the actual listener instead.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5672"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network

  # Declared once. Running `rabbitmq:setup` in every worker causes a cold-start
  # race and can leave a worker dead if queue arguments already exist with
  # different DLQ settings (PRECONDITION_FAILED).
  rabbitmq-setup:
    image: internet-apps-backend:local
    command: ["php", "artisan", "rabbitmq:setup"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-/}"
    volumes:
      - ./.env:/var/www/html/.env:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  rabbitmq-worker:
    image: internet-apps-backend:local
    # No container_name: Compose generates one name per replica.
    deploy:
      replicas: 3
    # prefetch-count=1 gives fair dispatch: a busy/slow worker never holds more
    # than one unacked message, so the other two replicas can take the rest.
    command:
      [
        "php",
        "artisan",
        "rabbitmq:consume",
        "--queue=order_emails_queue",
        "--tries=3",
        "--prefetch-count=1",
      ]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"
      SESSION_DRIVER: database
      DB_CONNECTION: mysql
      DB_HOST: mysql-primary
      DB_WRITE_HOST: mysql-primary
      DB_READ_HOST: "${DB_READ_HOST:-mysql-replica}"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-/}"
      RABBITMQ_QUEUE: order_emails_queue
      ORDER_STOCK_MANAGER: grpc
      GRPC_INVENTORY_HOST: inventory-service:9090
    volumes:
      - ./.env:/var/www/html/.env:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  order-email-outbox-publisher:
    image: internet-apps-backend:local
    container_name: internet-apps-order-email-outbox-publisher

    command:
      - sh
      - -c
      - |
        while true; do
          php artisan outbox:publish-order-emails
          sleep 5
        done

    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"

      DB_CONNECTION: mysql
      DB_HOST: mysql-primary
      DB_WRITE_HOST: mysql-primary
      DB_READ_HOST: "${DB_READ_HOST:-mysql-replica}"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-internet_apps}"
      DB_USERNAME: "${DB_USERNAME:-internet_apps}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"

      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-/}"
      RABBITMQ_QUEUE: order_emails_queue

    volumes:
      - ./.env:/var/www/html/.env:ro

    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network

volumes:
  mysql_primary_data:
  mysql_replica_data:
  inventory_mysql_data:
  product_images:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
